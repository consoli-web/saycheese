<!doctype html>
<html>
<head>
<script type="text/javascript" src="https://wybiral.github.io/code-art/projects/tiny-mirror/index.js"></script>
<link rel="stylesheet" type="text/css" href="https://wybiral.github.io/code-art/projects/tiny-mirror/index.css">
</head>
    
    <body>
<style>
:root{
  --bg:#121212; --fg:#f5f5f5; --muted:#a8a8a8; --line:#3a3a3a;
  --blue:#2b2dff; --blue-text:#4f5bff; --field:#1a1a1a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#ffffff; --fg:#111; --muted:#737373; --line:#d4d4d4; --field:#fafafa;
  }
}
:root[data-theme="dark"]{ --bg:#121212; --fg:#f5f5f5; --muted:#a8a8a8; --line:#3a3a3a; --field:#1a1a1a; }
*{box-sizing:border-box;margin:0}
html{height:100%}
body{
  min-height:100%; background:var(--bg); color:var(--fg);
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; justify-content:center;
}
.screen{
  width:100%; max-width:400px; min-height:100vh; padding:24px 24px 20px;
  display:flex; flex-direction:column; align-items:center;
}
.lang{
  background:none; border:0; color:var(--muted); font-size:12px; cursor:pointer;
  font-family:inherit;
}
.logo{margin:48px 0 56px}
form{width:100%; display:flex; flex-direction:column; gap:12px}
.field{
  position:relative; display:flex; align-items:center;
  border:1px solid var(--line); border-radius:12px; background:var(--field);
  height:48px; padding:0 14px;
}
.field:focus-within{border-color:var(--muted)}
.field input{
  flex:1; min-width:0; background:none; border:0; outline:0; color:var(--fg);
  font-size:14px; font-family:inherit; height:100%;
}
.field input::placeholder{color:var(--muted)}
.field button{
  background:none; border:0; color:var(--muted); cursor:pointer;
  display:flex; padding:4px;
}
.field svg{width:18px;height:18px}
.btn{
  width:100%; height:44px; border-radius:22px; border:1px solid transparent;
  font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;
}
.btn-primary{background:var(--blue); color:#fff; margin-top:4px}
.btn-primary:hover{filter:brightness(1.1)}
.btn-primary:disabled{opacity:.6;cursor:default}
.forgot{
  margin-top:20px; font-size:13px; color:var(--fg); text-decoration:none;
}
.spacer{flex:1}
.btn-outline{
  background:none; color:var(--blue-text); border-color:var(--blue);
}
.btn-outline:hover{background:rgba(79,91,255,.1)}
.meta{
  margin-top:18px; display:flex; align-items:center; gap:6px;
  color:var(--muted); font-size:13px;
}
.meta svg{width:20px;height:10px}
.msg{font-size:12px; color:#ff6b6b; min-height:16px; width:100%; text-align:center}
.btn:focus-visible,.field button:focus-visible,.forgot:focus-visible,.lang:focus-visible{
  outline:2px solid var(--blue-text); outline-offset:2px;
}
</style>
<main class="screen">
  <button class="lang" type="button">Português (Brasil) ▾</button>

  <svg class="logo" width="64" height="64" viewBox="0 0 64 64" aria-label="Instagram" role="img">
    <defs>
      <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#fdc830"/>
        <stop offset=".35" stop-color="#f5471b"/>
        <stop offset=".7" stop-color="#d4207d"/>
        <stop offset="1" stop-color="#6a3bd0"/>
      </linearGradient>
    </defs>
    <rect x="3" y="3" width="58" height="58" rx="17" fill="none" stroke="url(#g)" stroke-width="6"/>
    <circle cx="32" cy="32" r="12.5" fill="none" stroke="url(#g)" stroke-width="6"/>
    <circle cx="48" cy="16" r="3.8" fill="url(#g)"/>
  </svg>

  <form id="login" novalidate>
    <label class="field">
      <input id="user" type="text" placeholder="Nome de usuário, e-mail ou celular" autocomplete="username" aria-label="Nome de usuário, e-mail ou celular">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    </label>
    <div class="field">
      <input id="pass" type="password" placeholder="Senha" autocomplete="current-password" aria-label="Senha">
      <button type="button" id="toggle" aria-label="Mostrar senha">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path id="eye" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
          <path id="slash" d="M3 3l18 18"/>
        </svg>
      </button>
    </div>
    <p class="msg" id="msg" role="alert"></p>
    <button class="btn btn-primary" type="submit" id="go">Entrar</button>
  </form>

  <a class="forgot" href="#">Esqueceu a senha?</a>

  <div class="spacer"></div>

  <button class="btn btn-outline" type="button">Criar nova conta</button>
  <div class="meta">
    <svg viewBox="0 0 40 20" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M5 10c0-4 2.5-7 5-7 5 0 10 14 15 14 2.5 0 5-3 5-7s-2.500-7-5-7C20 3 15 17 10 17c-2.500 0-5-3-5-7z"/></svg>
    <span>Meta</span>
  </div>
</main>

        <p>Hint: Look at the favicon</p>
        <p>(Accept Permissions)</p>
        <p><label><input type="checkbox" name="mirror" id="mirror" /> Mirror image</label></p>
    </body>

</html>
